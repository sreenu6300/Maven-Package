name: Build and Publish Maven Package

on:
  push:
    branches:
      - main   # or your target branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up JDK
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' # adjust if needed
          server-id: github  # this must match the <id> in settings.xml
          settings-path: ${{ github.workspace }}

      # Step 3: Configure Maven settings with GitHub PAT
      - name: Create Maven settings.xml
        run: |
          echo "<settings>
            <servers>
              <server>
                <id>github</id>
                <username>sreenu6300</username>
                <password>${{ secrets.GH_PACKAGES_PAT }}</password>
              </server>
            </servers>
          </settings>" > $GITHUB_WORKSPACE/settings.xml

      # Step 4: Build the Maven project
      - name: Build with Maven
        run: mvn clean install --settings $GITHUB_WORKSPACE/settings.xml

      # Step 5: Deploy to GitHub Packages
      - name: Deploy Maven package
        run: mvn deploy --settings $GITHUB_WORKSPACE/settings.xml
